<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#332824">
  <meta name="description" content="Descubra uma, duas ou quatro palavras de cinco letras. Jogue quantas rodadas quiser.">
  <title>Giroletra · Jogo de palavras</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilo.css">
  <script defer src="lexico.js"></script>
  <script defer src="motor.js"></script>
  <script defer src="jogo.js"></script>
</head>
<body>
<header class="topo"><div class="faixa">
  <div class="marca"><img src="icon.svg" alt="" width="38" height="38"><h1>Giroletra</h1></div>
  <div id="modos" role="group" aria-label="Modo de jogo"></div>
  <nav aria-label="Ferramentas do jogo">
    <button id="ajuda" aria-label="Como jogar" title="Como jogar"><span class="icone-ajuda" aria-hidden="true">?</span></button>
    <button id="estatisticas" aria-label="Estatísticas" title="Estatísticas"><span class="barras" aria-hidden="true"><i></i><i></i><i></i></span></button>
  </nav>
</div></header>
<main>
  <div class="andamento">
    <span id="tentativa"></span>
    <button id="nova" class="acao">Nova rodada</button>
  </div>
  <section class="jogo" aria-label="Partida">
    <div id="tabuleiros"></div>
    <p id="mensagem" role="status" aria-live="polite"></p>
    <div id="teclado" role="group" aria-label="Teclado virtual"></div>
  </section>
</main>
<dialog id="modal" aria-labelledby="assunto"><div class="cab-modal"><h2 id="assunto"></h2><button id="fechar" aria-label="Fechar">×</button></div><div id="conteudo"></div></dialog>
<noscript>Ative o JavaScript no navegador para jogar.</noscript>
</body>
</html>
